<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240">
  <style>@keyframes aw-spin{to{transform:rotate(360deg)}}.aw-rays{animation:aw-spin 90s linear infinite;transform-origin:32px 32px}@keyframes aw-drift{50%{transform:translateX(5px)}}.aw-cloud{animation:aw-drift 7s ease-in-out infinite}@keyframes aw-fog-l{50%{transform:translateX(6px)}}@keyframes aw-fog-r{50%{transform:translateX(-6px)}}.aw-fog-a{animation:aw-fog-l 6s ease-in-out infinite}.aw-fog-b{animation:aw-fog-r 8s ease-in-out infinite}@keyframes aw-drift-back{50%{transform:translateX(-4px)}}.aw-cloud-back{animation:aw-drift-back 9s ease-in-out infinite}@keyframes aw-breathe{50%{transform:scale(1.05)}}.aw-sun-core{animation:aw-breathe 4s ease-in-out infinite;transform-origin:32px 32px}@keyframes aw-twinkle{50%{opacity:1}}.aw-star{opacity:.25;animation:aw-twinkle 2.8s ease-in-out infinite}.aw-t2{animation-delay:.9s}.aw-t3{animation-delay:1.7s}@keyframes aw-fall{70%{opacity:1}to{transform:translateY(13px);opacity:0}}.aw-drop{animation:aw-fall 1.2s linear infinite}.aw-d2{animation-delay:.4s}.aw-d3{animation-delay:.8s}.aw-streak{animation:aw-fall 1.1s linear infinite}@keyframes aw-bolt-flash{0%,86%{opacity:0}88%{opacity:1}90%{opacity:.35}93%{opacity:1}96%,100%{opacity:0}}.aw-bolt{animation:aw-bolt-flash 4.5s infinite}@keyframes aw-sheet{0%,85%{opacity:0}88%{opacity:.26}90%{opacity:.06}93%{opacity:.2}97%,100%{opacity:0}}.aw-flash{opacity:0;animation:aw-sheet 4.5s infinite}@keyframes aw-rise{from{transform:scaleY(0)}}.aw-grow{animation:aw-rise .6s cubic-bezier(.2,.8,.3,1) backwards}@media (prefers-reduced-motion:reduce){*{animation:none !important}}.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#5B8FC7}.aw-s1{stop-color:#8FB8DC}.aw-c0{stop-color:#ffffff}.aw-c1{stop-color:#d7dee8}.aw-bg{fill:transparent}.aw-overlay{fill:rgba(6,16,28,0.16)}@media (prefers-color-scheme:dark){.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#1B2A47}.aw-s1{stop-color:#45608A}.aw-c0{stop-color:#b8c4d4}.aw-c1{stop-color:#8494ac}.aw-bg{fill:transparent}.aw-overlay{fill:rgba(6,16,28,0.16)}}</style>
  <defs>
    <linearGradient id="aw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="aw-s0"/>
