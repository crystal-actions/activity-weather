    <linearGradient id="awg-storm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A8699"/>
      <stop offset="1" stop-color="#56637A"/>
    </linearGradient>
    <symbol id="aw-i-sunny" viewBox="0 0 64 64">
      <g class="aw-rays" stroke="#FFC53D" stroke-width="4.5" stroke-linecap="round">
