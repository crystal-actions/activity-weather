<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240">
  <style>@keyframes aw-bolt-flash{0%,86%{opacity:0}88%{opacity:1}90%{opacity:.35}93%{opacity:1}96%,100%{opacity:0}}.aw-bolt{animation:aw-bolt-flash 4.5s infinite}@keyframes aw-sheet{0%,85%{opacity:0}88%{opacity:.26}90%{opacity:.06}93%{opacity:.2}97%,100%{opacity:0}}.aw-flash{opacity:0;animation:aw-sheet 4.5s infinite}@keyframes aw-fall{70%{opacity:1}to{transform:translateY(13px);opacity:0}}.aw-drop{animation:aw-fall 1.2s linear infinite}.aw-d2{animation-delay:.4s}.aw-d3{animation-delay:.8s}.aw-streak{animation:aw-fall 1.1s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
  <defs>
    <linearGradient id="aw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161F"/>
      <stop offset="1" stop-color="#2C3646"/>
    </linearGradient>
    <linearGradient id="awg-cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8c4d4"/>
      <stop offset="1" stop-color="#8494ac"/>
    </linearGradient>
    <radialGradient id="awg-sun" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#FFE29A"/>
      <stop offset="1" stop-color="#FFB020"/>
    </radialGradient>
    <linearGradient id="awg-storm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A8699"/>
      <stop offset="1" stop-color="#56637A"/>
    </linearGradient>
    <symbol id="aw-i-stormy" viewBox="0 0 64 64">
      <line class="aw-drop aw-d1" x1="20" y1="45" x2="17" y2="52" stroke="#4FC3F7" stroke-width="3.5" stroke-linecap="round"/>
      <line class="aw-drop aw-d3" x1="46" y1="45" x2="43" y2="52" stroke="#4FC3F7" stroke-width="3.5" stroke-linecap="round"/>
      <g class="aw-cloud" transform="translate(1,-7) scale(0.95)" fill="url(#awg-storm)">
        <circle cx="19" cy="40" r="11"/>
        <circle cx="33" cy="31" r="14"/>
        <circle cx="45" cy="40" r="10"/>
        <rect x="14" y="36" width="42" height="15" rx="7.5"/>
      </g>
      <path class="aw-bolt" d="M34 36 L25 50 h6 L27 62 L41 46 h-7 l6 -10 z" fill="#FFD93D"/>
    </symbol>
    <clipPath id="aw-card"><rect x="1" y="1" width="478" height="238" rx="16"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="479" height="239" rx="16" fill="url(#aw-sky)" stroke="rgba(255,255,255,0.28)"/>
  <g clip-path="url(#aw-card)">
    <g stroke="#9FB3C8" stroke-width="2" stroke-linecap="round" opacity="0.35">
      <line class="aw-streak aw-d1" x1="416.92" y1="77.9" x2="413.92" y2="88.9"/>
      <line class="aw-streak aw-d2" x1="290.56" y1="79.42" x2="287.56" y2="90.42"/>
      <line class="aw-streak aw-d3" x1="360.51" y1="34.47" x2="357.51" y2="45.47"/>
      <line class="aw-streak aw-d1" x1="266.99" y1="56.93" x2="263.99" y2="67.93"/>
      <line class="aw-streak aw-d2" x1="207.13" y1="92.14" x2="204.13" y2="103.14"/>
      <line class="aw-streak aw-d3" x1="302.76" y1="74.07" x2="299.76" y2="85.07"/>
    </g>
  </g>
  <text x="28" y="37" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff">octo/weather-repo</text>
  <text x="452" y="34" text-anchor="end" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.78)">last 7 days</text>
  <text x="452" y="52" text-anchor="end" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="10.5" fill="rgba(255,255,255,0.78)" opacity="0.8">12 km/h · 48%</text>
  <use href="#aw-i-stormy" x="30" y="74" width="116" height="116"/>
  <text x="176" y="153" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff">18°</text>
  <text x="282.5" y="150" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="24" fill="#FFD93D">↘</text>
  <text x="178" y="178" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" fill="rgba(255,255,255,0.78)">STORMY</text>
  <text x="178" y="200" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="rgba(255,255,255,0.78)">Storm warning — issues are rolling in …</text>
  <line x1="28" y1="212" x2="452" y2="212" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>
  <text x="28" y="232" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">128<tspan dx="5" font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.78)">commits</tspan></text>
  <text x="136" y="232" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">12<tspan dx="5" font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.78)">prs</tspan></text>
  <text x="244" y="232" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">7<tspan dx="5" font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.78)">issues</tspan></text>
  <text x="352" y="232" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">+23<tspan dx="5" font-size="10.5" font-weight="400" fill="rgba(255,255,255,0.78)">stars</tspan></text>
  <rect class="aw-flash" x="1" y="1" width="478" height="238" rx="16" fill="#ffffff"/>
</svg>
