        <path d="M-4 0H4M-2 -3.46L2 3.46M-2 3.46L2 -3.46"/>
      </g>
      <g class="aw-flake aw-f2" transform="translate(33,55)" stroke="#DDEBFF" stroke-width="1.7" stroke-linecap="round">
        <path d="M-4 0H4M-2 -3.46L2 3.46M-2 3.46L2 -3.46"/>
      </g>
      <g class="aw-flake aw-f3" transform="translate(44,49)" stroke="#DDEBFF" stroke-width="1.7" stroke-linecap="round">
        <path d="M-4 0H4M-2 -3.46L2 3.46M-2 3.46L2 -3.46"/>
      </g>
      <g class="aw-cloud" transform="translate(1,-6) scale(0.92)" fill="url(#awg-cloud)">
