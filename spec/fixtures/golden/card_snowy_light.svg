<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240">
  <style>@keyframes aw-drift{50%{transform:translateX(5px)}}.aw-cloud{animation:aw-drift 7s ease-in-out infinite}@keyframes aw-snowfall{0%{transform:translate(0,0);opacity:1}50%{transform:translate(2.5px,8px)}90%{opacity:1}100%{transform:translate(-1px,15px);opacity:0}}.aw-flake{animation:aw-snowfall 3.2s linear infinite}.aw-f2{animation-delay:1.1s}.aw-f3{animation-delay:2.1s}@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
  <defs>
    <linearGradient id="aw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA9C9"/>
      <stop offset="1" stop-color="#D6E4F2"/>
    </linearGradient>
    <linearGradient id="awg-cloud" x1="0" y1="0" x2="0" y2="1">
