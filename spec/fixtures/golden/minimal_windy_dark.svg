<svg xmlns="http://www.w3.org/2000/svg" width="118.8" height="28" viewBox="0 0 118.8 28">
  <style>@keyframes aw-gust{0%{stroke-dashoffset:120;opacity:0}25%{opacity:1}85%{opacity:1}100%{stroke-dashoffset:-40;opacity:0}}.aw-wind{stroke-dasharray:70 90;animation:aw-gust 2.6s ease-in-out infinite}.aw-w2{animation-delay:.35s}.aw-w3{animation-delay:.7s}@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style>
  <defs>
