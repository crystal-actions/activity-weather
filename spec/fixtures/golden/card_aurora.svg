<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240">
  <style>@keyframes aw-ribbon-sway{50%{transform:translateX(7px) skewX(3deg)}}.aw-ribbon{animation:aw-ribbon-sway 10s ease-in-out infinite}.aw-r2{animation-delay:2.4s}.aw-r3{animation-delay:5.1s}@keyframes aw-twinkle{50%{opacity:1}}.aw-star{opacity:.25;animation:aw-twinkle 2.8s ease-in-out infinite}.aw-t2{animation-delay:.9s}.aw-t3{animation-delay:1.7s}@media (prefers-reduced-motion:reduce){*{animation:none !important}}.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#0B1D3A}.aw-s1{stop-color:#16436B}.aw-c0{stop-color:#ffffff}.aw-c1{stop-color:#d7dee8}.aw-bg{fill:transparent}@media (prefers-color-scheme:dark){.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#081426}.aw-s1{stop-color:#103352}.aw-c0{stop-color:#b8c4d4}.aw-c1{stop-color:#8494ac}.aw-bg{fill:transparent}}</style>
  <defs>
    <linearGradient id="aw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="aw-s0"/>
      <stop offset="1" class="aw-s1"/>
    </linearGradient>
    <linearGradient id="awg-cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="aw-c0"/>
      <stop offset="1" class="aw-c1"/>
    </linearGradient>
    <radialGradient id="awg-sun" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#FFE29A"/>
      <stop offset="1" stop-color="#FFB020"/>
    </radialGradient>
    <linearGradient id="awg-storm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A8699"/>
      <stop offset="1" stop-color="#56637A"/>
    </linearGradient>
    <symbol id="aw-i-aurora" viewBox="0 0 64 64">
      <path class="aw-ribbon aw-r1" d="M16 56 C10 42 22 34 17 18" fill="none" stroke="#46E8A0" stroke-width="6" stroke-linecap="round" opacity="0.78"/>
      <path class="aw-ribbon aw-r2" d="M28 56 C22 42 34 34 29 18" fill="none" stroke="#5BC0EB" stroke-width="6" stroke-linecap="round" opacity="0.78"/>
      <path class="aw-ribbon aw-r3" d="M40 56 C34 42 46 34 41 18" fill="none" stroke="#9B5DE5" stroke-width="6" stroke-linecap="round" opacity="0.78"/>
      <g fill="#E9F5FF">
        <circle class="aw-star aw-t1" cx="8" cy="12" r="1.4"/>
        <circle class="aw-star aw-t2" cx="52" cy="8" r="1.1"/>
        <circle class="aw-star aw-t3" cx="58" cy="24" r="1.3"/>
      </g>
    </symbol>
    <clipPath id="aw-card"><rect x="1" y="1" width="478" height="238" rx="16"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="479" height="239" rx="16" fill="url(#aw-sky)" class="aw-stroke"/>
  <g clip-path="url(#aw-card)">
    <g fill="#F4FAFF">
      <circle class="aw-star aw-t1" cx="416.92" cy="74.97" r="1.39" opacity="0.6"/>
      <circle class="aw-star aw-t2" cx="385.11" cy="70.42" r="1.01" opacity="0.6"/>
      <circle class="aw-star aw-t3" cx="266.99" cy="50.63" r="1.1" opacity="0.6"/>
      <circle class="aw-star aw-t1" cx="442.55" cy="55.57" r="1.65" opacity="0.6"/>
      <circle class="aw-star aw-t2" cx="330.58" cy="29.15" r="1.13" opacity="0.6"/>
      <circle class="aw-star aw-t3" cx="343.85" cy="39.46" r="1.16" opacity="0.6"/>
      <circle class="aw-star aw-t1" cx="236.16" cy="38.52" r="1.7" opacity="0.6"/>
      <circle class="aw-star aw-t2" cx="410.99" cy="46.12" r="1.1" opacity="0.6"/>
    </g>
    <path class="aw-ribbon aw-r1" d="M-20 52 C 120 12, 300 66, 500 18" fill="none" stroke="#46E8A0" stroke-width="20" stroke-linecap="round" opacity="0.14"/>
    <path class="aw-ribbon aw-r2" d="M-20 72 C 120 32, 300 86, 500 38" fill="none" stroke="#5BC0EB" stroke-width="20" stroke-linecap="round" opacity="0.14"/>
    <path class="aw-ribbon aw-r3" d="M-20 92 C 120 52, 300 106, 500 58" fill="none" stroke="#9B5DE5" stroke-width="20" stroke-linecap="round" opacity="0.14"/>
  </g>
  <text x="28" y="37" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" class="aw-ink">octo/weather-repo</text>
  <text x="452" y="34" text-anchor="end" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="12" class="aw-sub">last 7 days</text>
  <text x="452" y="52" text-anchor="end" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="10.5" class="aw-sub" opacity="0.8">12 km/h · 48%</text>
  <use href="#aw-i-aurora" x="30" y="74" width="116" height="116"/>
  <text x="176" y="153" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" class="aw-ink">24°</text>
  <text x="282.5" y="150" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="24" fill="#46E8A0">↗</text>
  <text x="178" y="178" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" class="aw-sub">AURORA</text>
  <text x="178" y="200" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" class="aw-sub">Aurora overhead — stargazers are flock…</text>
  <line x1="28" y1="212" x2="452" y2="212" class="aw-stroke" stroke-width="1"/>
  <text x="28" y="232" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="aw-ink">40<tspan dx="5" font-size="10.5" font-weight="400" class="aw-sub">commits</tspan></text>
  <text x="136" y="232" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="aw-ink">0<tspan dx="5" font-size="10.5" font-weight="400" class="aw-sub">prs</tspan></text>
  <text x="244" y="232" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="aw-ink">0<tspan dx="5" font-size="10.5" font-weight="400" class="aw-sub">issues</tspan></text>
  <text x="352" y="232" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" class="aw-ink">+180<tspan dx="5" font-size="10.5" font-weight="400" class="aw-sub">stars</tspan></text>
</svg>
