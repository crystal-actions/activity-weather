name: Activity Weather

on:
  schedule:
    # Daily, just after midnight UTC — the forecast strip buckets by UTC day.
    - cron: "17 0 * * *"
  workflow_dispatch:

# contents to push the SVGs; issues + pull-requests because the activity
# fetch reads the issues listing, which a `permissions:` block would
# otherwise silently strip from the workflow token.
permissions:
  contents: write
  issues: read
  pull-requests: read

# A second run pushing while the first is mid-commit is the usual way these
# workflows fail; queue them instead.
concurrency:
  group: activity-weather
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
