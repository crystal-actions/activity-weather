name: Activity Weather
description: Render your repository's recent activity as a weather report SVG — sunny commits, issue storms, foggy silence
author: hahwul

branding:
  icon: cloud-lightning
  color: blue

inputs:
  config:
    description: Path to the config YAML, relative to the repository root
    required: false
    default: .github/activity-weather.yml
  token:
    description: >-
      Token for the GitHub API. The default workflow token is enough for
      public repositories; a token with access is needed for private ones.
    required: false
    default: ${{ github.token }}
  repo:
    description: Repository to report on as owner/name (default is the repository running the workflow)
    required: false
  period:
    description: Reporting window like 7d, 2w, or 1m (default 7d; overrides the config)
    required: false
  no_commit:
    description: Generate the files but skip commit/push (must be true or false)
    required: false
    default: "false"
  commit_message:
    description: Commit message for the generated files
    required: false
    default: "chore: update activity weather"

outputs:
  condition:
    description: The weather condition, e.g. sunny, stormy, foggy, rainbow
  temperature:
    description: Activity temperature on a 0-40 scale, e.g. "23.5"
  phrase:
    description: The human-readable one-line report
  paths:
    description: Comma-separated paths of the generated SVG files
  width:
    description: Pixel width of the first generated file, for embedding with explicit dimensions
  height:
    description: Pixel height of the first generated file
  changed:
    description: Whether the files changed and were committed (false when no_commit is set)

runs:
  using: docker
  # Prebuilt so consumers start in seconds instead of building Crystal on
  # their runner.
  #
  # This floating tag is what `@main` tracks. Released refs do not use it: the
  # release workflow rewrites this line to the version's own immutable tag and
  # moves `vX.Y.Z` and `vX` onto that commit, so a pinned action ref always
  # determines the image — see .github/workflows/release.yml.
  image: docker://ghcr.io/crystal-actions/activity-weather:v0
