<svg xmlns="http://www.w3.org/2000/svg" width="132" height="28" viewBox="0 0 132 28">
  <style>@keyframes aw-drift{50%{transform:translateX(5px)}}.aw-cloud{animation:aw-drift 7s ease-in-out infinite}@keyframes aw-glow{50%{opacity:1}}.aw-arc{animation:aw-glow 5s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none !important}}.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#3D8FD6}.aw-s1{stop-color:#8FD0F5}.aw-c0{stop-color:#ffffff}.aw-c1{stop-color:#d7dee8}.aw-bg{fill:transparent}@media (prefers-color-scheme:dark){.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#12295C}.aw-s1{stop-color:#3A5FA0}.aw-c0{stop-color:#b8c4d4}.aw-c1{stop-color:#8494ac}.aw-bg{fill:transparent}}</style>
  <defs>
    <linearGradient id="aw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="aw-s0"/>
      <stop offset="1" class="aw-s1"/>
    </linearGradient>
    <linearGradient id="awg-cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="aw-c0"/>
      <stop offset="1" class="aw-c1"/>
    </linearGradient>
    <radialGradient id="awg-sun" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#FFE29A"/>
      <stop offset="1" stop-color="#FFB020"/>
    </radialGradient>
    <linearGradient id="awg-storm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A8699"/>
      <stop offset="1" stop-color="#56637A"/>
    </linearGradient>
    <symbol id="aw-i-rainbow" viewBox="0 0 64 64">
      <g fill="none" stroke-width="3.6" stroke-linecap="round" class="aw-arc" opacity="0.92">
        <path d="M5 46 A27 27 0 0 1 59 46" stroke="#FF5E5B"/>
        <path d="M9.5 46 A22.5 22.5 0 0 1 54.5 46" stroke="#FFB400"/>
        <path d="M14 46 A18 18 0 0 1 50 46" stroke="#7ED957"/>
        <path d="M18.5 46 A13.5 13.5 0 0 1 45.5 46" stroke="#38B6FF"/>
        <path d="M23 46 A9 9 0 0 1 41 46" stroke="#8C52FF"/>
      </g>
      <g class="aw-cloud" transform="translate(-9,28) scale(0.5)" fill="url(#awg-cloud)">
        <circle cx="19" cy="40" r="11"/>
        <circle cx="33" cy="31" r="14"/>
        <circle cx="45" cy="40" r="10"/>
        <rect x="14" y="36" width="42" height="15" rx="7.5"/>
      </g>
      <g class="aw-cloud" transform="translate(30,32) scale(0.42)" fill="url(#awg-cloud)">
        <circle cx="19" cy="40" r="11"/>
        <circle cx="33" cy="31" r="14"/>
        <circle cx="45" cy="40" r="10"/>
        <rect x="14" y="36" width="42" height="15" rx="7.5"/>
      </g>
    </symbol>
  </defs>
  <rect x="0.5" y="0.5" width="131" height="27" rx="13.5" fill="url(#aw-sky)" class="aw-stroke"/>
  <use href="#aw-i-rainbow" x="8" y="6" width="16" height="16"/>
  <text x="31" y="19" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" class="aw-ink">rainbow · 24°</text>
</svg>
