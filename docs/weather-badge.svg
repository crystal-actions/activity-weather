<svg xmlns="http://www.w3.org/2000/svg" width="171.6" height="28" viewBox="0 0 171.6 28">
  <style>@keyframes aw-spin{to{transform:rotate(360deg)}}.aw-rays{animation:aw-spin 90s linear infinite;transform-origin:32px 32px}@keyframes aw-drift{50%{transform:translateX(5px)}}.aw-cloud{animation:aw-drift 7s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none !important}}.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#5B8FC7}.aw-s1{stop-color:#8FB8DC}.aw-c0{stop-color:#ffffff}.aw-c1{stop-color:#d7dee8}.aw-bg{fill:transparent}@media (prefers-color-scheme:dark){.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#1B2A47}.aw-s1{stop-color:#45608A}.aw-c0{stop-color:#b8c4d4}.aw-c1{stop-color:#8494ac}.aw-bg{fill:transparent}}</style>
  <defs>
    <linearGradient id="aw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="aw-s0"/>
      <stop offset="1" class="aw-s1"/>
    </linearGradient>
    <linearGradient id="awg-cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="aw-c0"/>
      <stop offset="1" class="aw-c1"/>
    </linearGradient>
    <radialGradient id="awg-sun" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#FFE29A"/>
      <stop offset="1" stop-color="#FFB020"/>
    </radialGradient>
    <linearGradient id="awg-storm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A8699"/>
      <stop offset="1" stop-color="#56637A"/>
    </linearGradient>
    <symbol id="aw-i-partly_cloudy" viewBox="0 0 64 64">
      <g transform="translate(16,-8) scale(0.72)">
      <g class="aw-rays" stroke="#FFC53D" stroke-width="4.05" stroke-linecap="round">
        <line x1="50.9" y1="32" x2="58.1" y2="32"/>
        <line x1="45.36" y1="45.36" x2="50.46" y2="50.46"/>
        <line x1="32" y1="50.9" x2="32" y2="58.1"/>
        <line x1="18.64" y1="45.36" x2="13.54" y2="50.46"/>
        <line x1="13.1" y1="32" x2="5.9" y2="32"/>
        <line x1="18.64" y1="18.64" x2="13.54" y2="13.54"/>
        <line x1="32" y1="13.1" x2="32" y2="5.9"/>
        <line x1="45.36" y1="18.64" x2="50.46" y2="13.54"/>
      </g>
        <circle cx="32" cy="32" r="14" fill="url(#awg-sun)"/>
      </g>
      <g class="aw-cloud" transform="translate(-2,10) scale(0.92)" fill="url(#awg-cloud)">
        <circle cx="19" cy="40" r="11"/>
        <circle cx="33" cy="31" r="14"/>
        <circle cx="45" cy="40" r="10"/>
        <rect x="14" y="36" width="42" height="15" rx="7.5"/>
      </g>
    </symbol>
  </defs>
  <rect x="0.5" y="0.5" width="170.6" height="27" rx="13.5" fill="url(#aw-sky)" class="aw-stroke"/>
  <use href="#aw-i-partly_cloudy" x="8" y="6" width="16" height="16"/>
  <text x="31" y="19" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" class="aw-ink">partly cloudy · 13°</text>
</svg>
