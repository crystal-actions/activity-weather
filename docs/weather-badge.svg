<svg xmlns="http://www.w3.org/2000/svg" width="111.6" height="28" viewBox="0 0 111.6 28">
  <style>@keyframes aw-fog-l{50%{transform:translateX(6px)}}@keyframes aw-fog-r{50%{transform:translateX(-6px)}}.aw-fog-a{animation:aw-fog-l 6s ease-in-out infinite}.aw-fog-b{animation:aw-fog-r 8s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none !important}}.aw-ink{fill:#243140}.aw-sub{fill:rgba(36,49,64,0.76)}.aw-faint{fill:rgba(36,49,64,0.24)}.aw-stroke{stroke:rgba(36,49,64,0.24)}.aw-s0{stop-color:#9AA5B1}.aw-s1{stop-color:#C6CDD5}.aw-c0{stop-color:#ffffff}.aw-c1{stop-color:#d7dee8}.aw-bg{fill:transparent}@media (prefers-color-scheme:dark){.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#252A31}.aw-s1{stop-color:#4A525C}.aw-c0{stop-color:#b8c4d4}.aw-c1{stop-color:#8494ac}.aw-bg{fill:transparent}}</style>
  <defs>
    <linearGradient id="aw-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="aw-s0"/>
      <stop offset="1" class="aw-s1"/>
    </linearGradient>
    <linearGradient id="awg-cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="aw-c0"/>
      <stop offset="1" class="aw-c1"/>
    </linearGradient>
    <radialGradient id="awg-sun" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#FFE29A"/>
      <stop offset="1" stop-color="#FFB020"/>
    </radialGradient>
    <linearGradient id="awg-storm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A8699"/>
      <stop offset="1" stop-color="#56637A"/>
    </linearGradient>
    <symbol id="aw-i-foggy" viewBox="0 0 64 64">
      <g class="aw-cloud" transform="translate(2,-10) scale(0.88)" fill="url(#awg-cloud)" opacity="0.75">
        <circle cx="19" cy="40" r="11"/>
        <circle cx="33" cy="31" r="14"/>
        <circle cx="45" cy="40" r="10"/>
        <rect x="14" y="36" width="42" height="15" rx="7.5"/>
      </g>
      <g stroke="#AEBBC9" stroke-width="4.5" stroke-linecap="round">
        <line class="aw-fog-a" x1="14" y1="47" x2="46" y2="47"/>
        <line class="aw-fog-b" x1="20" y1="54" x2="52" y2="54"/>
        <line class="aw-fog-a" x1="12" y1="61" x2="38" y2="61"/>
      </g>
    </symbol>
  </defs>
  <rect x="0.5" y="0.5" width="110.6" height="27" rx="13.5" fill="url(#aw-sky)" class="aw-stroke"/>
  <use href="#aw-i-foggy" x="8" y="6" width="16" height="16"/>
  <text x="31" y="19" font-family="-apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" class="aw-ink">foggy · 9°</text>
</svg>
