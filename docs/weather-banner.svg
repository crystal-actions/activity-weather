<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220">
  <style>@keyframes aw-spin{to{transform:rotate(360deg)}}.aw-rays{animation:aw-spin 90s linear infinite;transform-origin:32px 32px}@keyframes aw-drift{50%{transform:translateX(5px)}}.aw-cloud{animation:aw-drift 7s ease-in-out infinite}@keyframes aw-drift-far{50%{transform:translateX(14px)}}@keyframes aw-drift-near{50%{transform:translateX(-11px)}}.aw-layer-far{animation:aw-drift-far 34s ease-in-out infinite}.aw-layer-near{animation:aw-drift-near 22s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none !important}}.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#5B8FC7}.aw-s1{stop-color:#8FB8DC}.aw-c0{stop-color:#ffffff}.aw-c1{stop-color:#d7dee8}.aw-bg{fill:transparent}@media (prefers-color-scheme:dark){.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#1B2A47}.aw-s1{stop-color:#45608A}.aw-c0{stop-color:#b8c4d4}.aw-c1{stop-color:#8494ac}.aw-bg{fill:transparent}}</style>
