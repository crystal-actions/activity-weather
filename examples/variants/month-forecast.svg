<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240">
  <style>@keyframes aw-drift{50%{transform:translateX(5px)}}.aw-cloud{animation:aw-drift 7s ease-in-out infinite}@keyframes aw-glow{50%{opacity:1}}.aw-arc{animation:aw-glow 5s ease-in-out infinite}@keyframes aw-gust{0%{stroke-dashoffset:120;opacity:0}25%{opacity:1}85%{opacity:1}100%{stroke-dashoffset:-40;opacity:0}}.aw-wind{stroke-dasharray:70 90;animation:aw-gust 2.6s ease-in-out infinite}.aw-w2{animation-delay:.35s}.aw-w3{animation-delay:.7s}@keyframes aw-fall{70%{opacity:1}to{transform:translateY(13px);opacity:0}}.aw-drop{animation:aw-fall 1.2s linear infinite}.aw-d2{animation-delay:.4s}.aw-d3{animation-delay:.8s}.aw-streak{animation:aw-fall 1.1s linear infinite}@keyframes aw-spin{to{transform:rotate(360deg)}}.aw-rays{animation:aw-spin 90s linear infinite;transform-origin:32px 32px}@keyframes aw-rise{from{transform:scaleY(0)}}.aw-grow{animation:aw-rise .6s cubic-bezier(.2,.8,.3,1) backwards}@media (prefers-reduced-motion:reduce){*{animation:none !important}}.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#3D8FD6}.aw-s1{stop-color:#8FD0F5}.aw-c0{stop-color:#ffffff}.aw-c1{stop-color:#d7dee8}.aw-bg{fill:transparent}.aw-overlay{fill:rgba(6,16,28,0.16)}@media (prefers-color-scheme:dark){.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#12295C}.aw-s1{stop-color:#3A5FA0}.aw-c0{stop-color:#b8c4d4}.aw-c1{stop-color:#8494ac}.aw-bg{fill:transparent}.aw-overlay{fill:rgba(6,16,28,0.16)}}</style>
