  <style>@keyframes aw-gust{0%{stroke-dashoffset:120;opacity:0}25%{opacity:1}85%{opacity:1}100%{stroke-dashoffset:-40;opacity:0}}.aw-wind{stroke-dasharray:70 90;animation:aw-gust 2.6s ease-in-out infinite}.aw-w2{animation-delay:.35s}.aw-w3{animation-delay:.7s}@keyframes aw-drift-far{50%{transform:translateX(14px)}}@keyframes aw-drift-near{50%{transform:translateX(-11px)}}.aw-layer-far{animation:aw-drift-far 34s ease-in-out infinite}.aw-layer-near{animation:aw-drift-near 22s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none !important}}.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#4193BE}.aw-s1{stop-color:#7FC4DC}.aw-c0{stop-color:#ffffff}.aw-c1{stop-color:#d7dee8}.aw-bg{fill:transparent}@media (prefers-color-scheme:dark){.aw-ink{fill:#ffffff}.aw-sub{fill:rgba(255,255,255,0.78)}.aw-faint{fill:rgba(255,255,255,0.28)}.aw-stroke{stroke:rgba(255,255,255,0.28)}.aw-s0{stop-color:#173044}.aw-s1{stop-color:#3A5E77}.aw-c0{stop-color:#b8c4d4}.aw-c1{stop-color:#8494ac}.aw-bg{fill:transparent}}</style>
